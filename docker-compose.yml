# Бот. Свой сервер Bot API (файлы до 2 ГБ) подключается файлом
# docker-compose.local-api.yml — установщик прописывает это в COMPOSE_FILE в .env.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DOWNLOAD_DIR: /downloads
    volumes:
      - downloads:/downloads
      - ./data:/data  # cookies.txt и прочие настройки
    logging: *logging

volumes:
  downloads:
